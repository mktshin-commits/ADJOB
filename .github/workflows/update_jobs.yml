name: Daily Job Data Update

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC) = 한국시간 09:00 실행
  workflow_dispatch: # 수동 실행 가능

# GITHUB_TOKEN 기본 권한은 읽기 전용이라 이 줄이 없으면 push 단계에서 403으로 실패한다.
permissions:
  contents: write

# 예약 실행과 수동 실행이 겹쳐 jobs.json 푸시가 충돌하지 않도록 직렬화
concurrency:
  group: daily-job-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pull --rebase 가 shallow clone에서 실패하지 않도록 전체 이력 확보

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # ubuntu-26.04 러너는 3.9를 제공하지 않는다

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -z "$(git status --porcelain jobs.json)" ]; then
            echo "No changes to jobs.json"
            exit 0
          fi
          git add jobs.json
          git commit -m "Auto-update jobs.json [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
